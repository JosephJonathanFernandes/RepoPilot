name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest build ruff mypy

    - name: Run linting (ruff)
      run: |
        ruff check repopilot tests validation research
        ruff format --check repopilot tests validation research

    - name: Run type checking (mypy)
      run: |
        mypy repopilot

    - name: Run unit tests
      run: |
        python -m pytest tests/

    - name: Run synthetic validation
      run: |
        python -m validation.runner

    - name: Build package
      run: |
        python -m build

    - name: Verify package installation
      run: |
        python -m venv test_env
        source test_env/bin/activate
        pip install dist/*.whl
        repopilot --help
        repopilot .
