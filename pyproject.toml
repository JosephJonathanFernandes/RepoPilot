[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "A deterministic repository intelligence engine with evidence-backed LLM explanations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT License"}
authors = [
  {name = "Joseph", email = "joseph@example.com"}
]
dependencies = []

[project.scripts]
repopilot = "repopilot.cli:main"

[tool.setuptools]
packages = ["repopilot"]
